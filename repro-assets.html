<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Control Dashboard</title>
    <style>
        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #151b3d;
            --bg-card: #1a2147;
            --bg-card-hover: #1f2654;
            --text-primary: #e8eaf6;
            --text-secondary: #9fa8da;
            --text-muted: #5c6bc0;
            --accent-primary: #7c4dff;
            --accent-secondary: #536dfe;
            --accent-success: #00e676;
            --accent-warning: #ffd740;
            --accent-danger: #ff5252;
            --border-color: #283593;
            --shadow: rgba(0, 0, 0, 0.4);
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        [data-theme="light"] {
            --bg-primary: #f5f7fa;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f8f9fb;
            --text-primary: #1a202c;
            --text-secondary: #4a5568;
            --text-muted: #718096;
            --accent-primary: #6b46c1;
            --accent-secondary: #4c51bf;
            --accent-success: #00c853;
            --accent-warning: #ffa000;
            --accent-danger: #e53e3e;
            --border-color: #e2e8f0;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 2px solid var(--border-color);
            padding: var(--spacing-lg) var(--spacing-md);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .logo {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo svg {
            width: 100%;
            height: 100%;
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-success);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .btn {
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-primary);
            transform: translateY(-1px);
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        .btn-icon {
            width: 20px;
            height: 20px;
        }

        /* Main Content */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--spacing-xl) var(--spacing-md);
        }

        /* Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
        }

        .search-bar {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: var(--spacing-md) var(--spacing-md) var(--spacing-md) 48px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(124, 77, 255, 0.1);
        }

        .search-icon {
            position: absolute;
            left: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--text-muted);
        }

        .filter-tabs {
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
            background: var(--bg-secondary);
            padding: var(--spacing-sm);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
        }

        .filter-tab {
            padding: var(--spacing-sm) var(--spacing-md);
            background: transparent;
            border: none;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .filter-tab:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .filter-tab:focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        .filter-tab.active {
            background: var(--accent-primary);
            color: white;
        }

        .filter-tab .count {
            display: inline-block;
            margin-left: var(--spacing-xs);
            padding: 2px 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
        }

        /* Mission Cards Grid */
        .missions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr));
            gap: var(--spacing-lg);
        }

        .mission-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .mission-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--shadow);
        }

        .mission-card:focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        .mission-card.hidden {
            display: none;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--spacing-md);
            gap: var(--spacing-md);
        }

        .mission-id {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .status-badge {
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge.active {
            background: rgba(0, 230, 118, 0.15);
            color: var(--accent-success);
        }

        .status-badge.planned {
            background: rgba(83, 109, 254, 0.15);
            color: var(--accent-secondary);
        }

        .status-badge.completed {
            background: rgba(124, 77, 255, 0.15);
            color: var(--accent-primary);
        }

        .status-badge.delayed {
            background: rgba(255, 82, 82, 0.15);
            color: var(--accent-danger);
        }

        .mission-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }

        .mission-description {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: var(--spacing-md);
            line-height: 1.5;
        }

        .mission-meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
        }

        .meta-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .meta-value {
            font-size: 0.875rem;
            color: var(--text-primary);
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            overflow: hidden;
            margin-bottom: var(--spacing-md);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border-radius: var(--radius-sm);
            transition: width 0.3s ease;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--border-color);
        }

        .crew-avatars {
            display: flex;
            align-items: center;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: 2px solid var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: white;
            margin-left: -8px;
        }

        .avatar:first-child {
            margin-left: 0;
        }

        .expand-btn {
            background: none;
            border: none;
            color: var(--accent-primary);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius-sm);
            transition: all 0.2s ease;
        }

        .expand-btn:hover {
            background: rgba(124, 77, 255, 0.1);
        }

        .expand-btn:focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        .expand-icon {
            width: 16px;
            height: 16px;
            transition: transform 0.3s ease;
        }

        .mission-card.expanded .expand-icon {
            transform: rotate(180deg);
        }

        /* Expanded Details */
        .mission-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .mission-card.expanded .mission-details {
            max-height: 500px;
        }

        .details-content {
            padding-top: var(--spacing-md);
            margin-top: var(--spacing-md);
            border-top: 1px solid var(--border-color);
        }

        .details-section {
            margin-bottom: var(--spacing-md);
        }

        .details-section:last-child {
            margin-bottom: 0;
        }

        .details-title {
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
        }

        .details-text {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .milestone-list {
            list-style: none;
        }

        .milestone-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) 0;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .milestone-item::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-success);
            flex-shrink: 0;
        }

        .milestone-item.pending::before {
            background: var(--text-muted);
        }

        /* Settings Drawer */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .drawer-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .settings-drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: min(400px, 90vw);
            background: var(--bg-secondary);
            box-shadow: -4px 0 24px var(--shadow);
            z-index: 201;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .settings-drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            padding: var(--spacing-sm);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: var(--bg-card);
        }

        .close-btn:focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        .drawer-content {
            padding: var(--spacing-lg);
            overflow-y: auto;
            flex: 1;
        }

        .setting-group {
            margin-bottom: var(--spacing-xl);
        }

        .setting-group:last-child {
            margin-bottom: 0;
        }

        .setting-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
            display: block;
        }

        .setting-description {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: var(--spacing-md);
        }

        .theme-options {
            display: flex;
            gap: var(--spacing-md);
        }

        .theme-option {
            flex: 1;
            padding: var(--spacing-md);
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .theme-option:hover {
            border-color: var(--accent-primary);
        }

        .theme-option:focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        .theme-option.active {
            border-color: var(--accent-primary);
            background: rgba(124, 77, 255, 0.1);
        }

        .theme-icon {
            width: 32px;
            height: 32px;
            margin: 0 auto var(--spacing-sm);
        }

        .theme-name {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: var(--spacing-xl) var(--spacing-md);
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: var(--spacing-md);
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-actions {
                width: 100%;
                justify-content: space-between;
            }

            .mission-meta {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .filter-tabs {
                overflow-x: auto;
                flex-wrap: nowrap;
            }

            .theme-options {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="header-title">
                <div class="logo" aria-hidden="true">
                    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2" fill="none" opacity="0.3"/>
                        <circle cx="24" cy="24" r="14" stroke="currentColor" stroke-width="2" fill="none" opacity="0.5"/>
                        <circle cx="24" cy="24" r="8" fill="currentColor"/>
                        <path d="M24 4 L24 12 M24 36 L24 44 M4 24 L12 24 M36 24 L44 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M10 10 L16 16 M32 32 L38 38 M38 10 L32 16 M16 32 L10 38" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                    </svg>
                </div>
                <h1>Mission Control Dashboard</h1>
            </div>
            <div class="header-actions">
                <div class="status-indicator">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span>All Systems Operational</span>
                </div>
                <button class="btn" id="settingsBtn" aria-label="Open settings">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M12 1v6m0 6v6m9-9h-6m-6 0H3"></path>
                    </svg>
                    Settings
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="controls">
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <label for="searchInput" class="sr-only">Search missions</label>
                <input 
                    type="search" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Search missions by name, ID, or crew..."
                    aria-label="Search missions"
                >
            </div>

            <div class="filter-tabs" role="tablist" aria-label="Mission status filters">
                <button class="filter-tab active" role="tab" data-filter="all" aria-selected="true">
                    All Missions <span class="count">6</span>
                </button>
                <button class="filter-tab" role="tab" data-filter="active" aria-selected="false">
                    Active <span class="count">2</span>
                </button>
                <button class="filter-tab" role="tab" data-filter="planned" aria-selected="false">
                    Planned <span class="count">2</span>
                </button>
                <button class="filter-tab" role="tab" data-filter="completed" aria-selected="false">
                    Completed <span class="count">1</span>
                </button>
                <button class="filter-tab" role="tab" data-filter="delayed" aria-selected="false">
                    Delayed <span class="count">1</span>
                </button>
            </div>
        </div>

        <div class="missions-grid" id="missionsGrid" role="region" aria-live="polite" aria-label="Mission cards">
            <!-- Mission cards will be inserted here by JavaScript -->
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
            </svg>
            <p>No missions found matching your search.</p>
        </div>
    </main>

    <!-- Settings Drawer -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <aside class="settings-drawer" id="settingsDrawer" role="dialog" aria-labelledby="drawerTitle" aria-modal="true">
        <div class="drawer-header">
            <h2 class="drawer-title" id="drawerTitle">Settings</h2>
            <button class="close-btn" id="closeDrawerBtn" aria-label="Close settings">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="drawer-content">
            <div class="setting-group">
                <label class="setting-label" id="themeLabel">Theme Preference</label>
                <p class="setting-description">Choose your preferred color scheme for the dashboard</p>
                <div class="theme-options" role="radiogroup" aria-labelledby="themeLabel">
                    <button class="theme-option" data-theme="dark" role="radio" aria-checked="true" tabindex="0">
                        <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                        <div class="theme-name">Dark</div>
                    </button>
                    <button class="theme-option" data-theme="light" role="radio" aria-checked="false" tabindex="-1">
                        <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <div class="theme-name">Light</div>
                    </button>
                </div>
            </div>
        </div>
    </aside>

    <script>
        // Mission data
        const missions = [
            {
                id: 'MSN-2024-001',
                title: 'Artemis Lunar Gateway',
                description: 'Establish the first lunar orbital station to support sustained exploration and research.',
                status: 'active',
                progress: 67,
                launch: 'Mar 15, 2024',
                duration: '18 months',
                crew: ['Sarah Chen', 'Marcus Rodriguez', 'Yuki Tanaka'],
                objectives: 'Deploy modular habitat units, establish communication relay, conduct lunar surface reconnaissance.',
                milestones: [
                    { text: 'Launch and orbital insertion', completed: true },
                    { text: 'Habitat module deployment', completed: true },
                    { text: 'Communication systems online', completed: true },
                    { text: 'First crew rotation', completed: false },
                    { text: 'Science operations begin', completed: false }
                ]
            },
            {
                id: 'MSN-2024-002',
                title: 'Mars Sample Return',
                description: 'Retrieve and analyze geological samples from the Jezero Crater region.',
                status: 'active',
                progress: 42,
                launch: 'Jan 8, 2024',
                duration: '24 months',
                crew: ['Dr. Elena Volkov', 'James Park', 'Amara Okafor'],
                objectives: 'Collect 30+ diverse rock and soil samples, analyze for biosignatures, return samples to Earth for detailed study.',
                milestones: [
                    { text: 'Mars orbit achieved', completed: true },
                    { text: 'Landing site confirmed', completed: true },
                    { text: 'Sample collection (15/30)', completed: false },
                    { text: 'Return vehicle prep', completed: false },
                    { text: 'Earth return trajectory', completed: false }
                ]
            },
            {
                id: 'MSN-2024-003',
                title: 'Europa Clipper Survey',
                description: 'Conduct detailed reconnaissance of Jupiter\'s moon Europa and its subsurface ocean.',
                status: 'planned',
                progress: 15,
                launch: 'Oct 10, 2024',
                duration: '36 months',
                crew: ['Dr. Raj Patel', 'Sofia Andersson', 'Chen Wei'],
                objectives: 'Map surface composition, measure ice shell thickness, detect potential plumes, assess habitability.',
                milestones: [
                    { text: 'Pre-launch systems check', completed: true },
                    { text: 'Launch window confirmed', completed: false },
                    { text: 'Jupiter gravity assist', completed: false },
                    { text: 'Europa orbit insertion', completed: false },
                    { text: 'Science mission start', completed: false }
                ]
            },
            {
                id: 'MSN-2024-004',
                title: 'ISS Decommission Prep',
                description: 'Prepare the International Space Station for controlled deorbit and safe disposal.',
                status: 'delayed',
                progress: 28,
                launch: 'May 20, 2024',
                duration: '12 months',
                crew: ['Commander Lisa Zhang', 'Viktor Sokolov'],
                objectives: 'Archive critical research data, remove hazardous materials, plan deorbit trajectory, coordinate international protocols.',
                milestones: [
                    { text: 'Data archival complete', completed: true },
                    { text: 'Hazmat removal', completed: false },
                    { text: 'Structural assessment', completed: false },
                    { text: 'Deorbit planning', completed: false },
                    { text: 'Final crew evacuation', completed: false }
                ]
            },
            {
                id: 'MSN-2024-005',
                title: 'Titan Atmospheric Probe',
                description: 'Deploy advanced atmospheric probe to study Saturn\'s largest moon.',
                status: 'planned',
                progress: 8,
                launch: 'Dec 1, 2024',
                duration: '48 months',
                crew: ['Dr. Hannah Foster', 'Kenji Yamamoto', 'Maria Santos', 'Alex Turner'],
                objectives: 'Analyze atmospheric composition, study methane cycle, investigate prebiotic chemistry, capture surface imagery.',
                milestones: [
                    { text: 'Mission design review', completed: true },
                    { text: 'Probe construction', completed: false },
                    { text: 'Launch preparation', completed: false },
                    { text: 'Saturn approach', completed: false },
                    { text: 'Titan descent', completed: false }
                ]
            },
            {
                id: 'MSN-2023-012',
                title: 'Hubble Final Service',
                description: 'Complete the final servicing mission to extend Hubble Space Telescope operations.',
                status: 'completed',
                progress: 100,
                launch: 'Aug 5, 2023',
                duration: '6 months',
                crew: ['Commander Mike Torres', 'Dr. Priya Sharma', 'David Kim'],
                objectives: 'Replace aging gyroscopes, upgrade power systems, install new instruments, extend operational life to 2030.',
                milestones: [
                    { text: 'Rendezvous with Hubble', completed: true },
                    { text: 'Gyroscope replacement', completed: true },
                    { text: 'Power system upgrade', completed: true },
                    { text: 'Instrument installation', completed: true },
                    { text: 'Systems verification', completed: true }
                ]
            }
        ];

        // State
        let currentFilter = 'all';
        let searchQuery = '';
        let currentTheme = localStorage.getItem('theme') || 'dark';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            applyTheme(currentTheme);
            renderMissions();
            setupEventListeners();
        });

        // Render missions
        function renderMissions() {
            const grid = document.getElementById('missionsGrid');
            const emptyState = document.getElementById('emptyState');
            
            const filteredMissions = missions.filter(mission => {
                const matchesFilter = currentFilter === 'all' || mission.status === currentFilter;
                const matchesSearch = searchQuery === '' || 
                    mission.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    mission.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    mission.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    mission.crew.some(member => member.toLowerCase().includes(searchQuery.toLowerCase()));
                
                return matchesFilter && matchesSearch;
            });

            if (filteredMissions.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'block';
            } else {
                grid.style.display = 'grid';
                emptyState.style.display = 'none';
                
                grid.innerHTML = filteredMissions.map(mission => `
                    <article class="mission-card" tabindex="0" data-mission-id="${mission.id}" role="article" aria-label="${mission.title}">
                        <div class="card-header">
                            <span class="mission-id">${mission.id}</span>
                            <span class="status-badge ${mission.status}">${mission.status}</span>
                        </div>
                        
                        <h3 class="mission-title">${mission.title}</h3>
                        <p class="mission-description">${mission.description}</p>
                        
                        <div class="mission-meta">
                            <div class="meta-item">
                                <span class="meta-label">Launch Date</span>
                                <span class="meta-value">${mission.launch}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Duration</span>
                                <span class="meta-value">${mission.duration}</span>
                            </div>
                        </div>
                        
                        <div class="progress-bar" role="progressbar" aria-valuenow="${mission.progress}" aria-valuemin="0" aria-valuemax="100" aria-label="Mission progress">
                            <div class="progress-fill" style="width: ${mission.progress}%"></div>
                        </div>
                        
                        <div class="card-footer">
                            <div class="crew-avatars" aria-label="Crew members: ${mission.crew.join(', ')}">
                                ${mission.crew.slice(0, 3).map(member => `
                                    <div class="avatar" title="${member}">${getInitials(member)}</div>
                                `).join('')}
                            </div>
                            <button class="expand-btn" aria-expanded="false" aria-label="Show mission details">
                                Details
                                <svg class="expand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                            </button>
                        </div>
                        
                        <div class="mission-details">
                            <div class="details-content">
                                <div class="details-section">
                                    <h4 class="details-title">Mission Objectives</h4>
                                    <p class="details-text">${mission.objectives}</p>
                                </div>
                                <div class="details-section">
                                    <h4 class="details-title">Key Milestones</h4>
                                    <ul class="milestone-list">
                                        ${mission.milestones.map(milestone => `
                                            <li class="milestone-item ${milestone.completed ? '' : 'pending'}">${milestone.text}</li>
                                        `).join('')}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </article>
                `).join('');
            }
        }

        // Get initials from name
        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('').toUpperCase();
        }

        // Setup event listeners
        function setupEventListeners() {
            // Search
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderMissions();
            });

            // Filter tabs
            const filterTabs = document.querySelectorAll('.filter-tab');
            filterTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    filterTabs.forEach(t => {
                        t.classList.remove('active');
                        t.setAttribute('aria-selected', 'false');
                    });
                    tab.classList.add('active');
                    tab.setAttribute('aria-selected', 'true');
                    currentFilter = tab.dataset.filter;
                    renderMissions();
                });
            });

            // Mission card expand/collapse
            document.getElementById('missionsGrid').addEventListener('click', (e) => {
                const expandBtn = e.target.closest('.expand-btn');
                if (expandBtn) {
                    const card = expandBtn.closest('.mission-card');
                    const isExpanded = card.classList.toggle('expanded');
                    expandBtn.setAttribute('aria-expanded', isExpanded);
                    expandBtn.setAttribute('aria-label', isExpanded ? 'Hide mission details' : 'Show mission details');
                }
            });

            // Keyboard navigation for cards
            document.getElementById('missionsGrid').addEventListener('keydown', (e) => {
                if (e.target.classList.contains('mission-card') && (e.key === 'Enter' || e.key === ' ')) {
                    e.preventDefault();
                    const expandBtn = e.target.querySelector('.expand-btn');
                    if (expandBtn) expandBtn.click();
                }
            });

            // Settings drawer
            const settingsBtn = document.getElementById('settingsBtn');
            const closeDrawerBtn = document.getElementById('closeDrawerBtn');
            const drawerOverlay = document.getElementById('drawerOverlay');
            const settingsDrawer = document.getElementById('settingsDrawer');

            function openDrawer() {
                drawerOverlay.classList.add('open');
                settingsDrawer.classList.add('open');
                closeDrawerBtn.focus();
            }

            function closeDrawer() {
                drawerOverlay.classList.remove('open');
                settingsDrawer.classList.remove('open');
                settingsBtn.focus();
            }

            settingsBtn.addEventListener('click', openDrawer);
            closeDrawerBtn.addEventListener('click', closeDrawer);
            drawerOverlay.addEventListener('click', closeDrawer);

            // Escape key to close drawer
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && settingsDrawer.classList.contains('open')) {
                    closeDrawer();
                }
            });

            // Theme selection
            const themeOptions = document.querySelectorAll('.theme-option');
            themeOptions.forEach(option => {
                option.addEventListener('click', () => {
                    const theme = option.dataset.theme;
                    applyTheme(theme);
                    
                    themeOptions.forEach(opt => {
                        opt.classList.remove('active');
                        opt.setAttribute('aria-checked', 'false');
                        opt.setAttribute('tabindex', '-1');
                    });
                    option.classList.add('active');
                    option.setAttribute('aria-checked', 'true');
                    option.setAttribute('tabindex', '0');
                });

                // Keyboard navigation for theme options
                option.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        option.click();
                    }
                });
            });
        }

        // Apply theme
        function applyTheme(theme) {
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            
            // Update active theme option
            const themeOptions = document.querySelectorAll('.theme-option');
            themeOptions.forEach(option => {
                if (option.dataset.theme === theme) {
                    option.classList.add('active');
                    option.setAttribute('aria-checked', 'true');
                    option.setAttribute('tabindex', '0');
                } else {
                    option.classList.remove('active');
                    option.setAttribute('aria-checked', 'false');
                    option.setAttribute('tabindex', '-1');
                }
            });
        }
    </script>
</body>
</html>
