<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PR45 Readiness Test</title>
  <style>
    :root {
      --color-bg: #ffffff;
      --color-text: #1a1a1a;
      --color-card: #f8f9fa;
      --color-border: #e1e4e8;
      --color-success: #28a745;
      --color-error: #dc3545;
      --color-pending: #6c757d;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #0d1117;
        --color-text: #e6edf3;
        --color-card: #161b22;
        --color-border: #30363d;
        --color-success: #3fb950;
        --color-error: #f85149;
        --color-pending: #8b949e;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 480px;
      width: 100%;
    }

    h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 600;
      margin-bottom: 32px;
      text-align: center;
      letter-spacing: -0.02em;
    }

    .status-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      transition: box-shadow 0.2s ease;
    }

    .status-card:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 1.125rem;
      font-weight: 500;
    }

    .status-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
    }

    .status-dot.online {
      background: var(--color-success);
      box-shadow: 0 0 0 4px rgba(40, 167, 69, 0.2);
      animation: pulse 2s ease-in-out infinite;
    }

    .status-dot.offline {
      background: var(--color-error);
      box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.2);
    }

    .status-dot.pending {
      background: var(--color-pending);
      box-shadow: 0 0 0 4px rgba(108, 117, 125, 0.2);
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.6;
      }
    }

    .status-text {
      flex: 1;
    }

    .status-label {
      display: block;
      font-size: 0.875rem;
      color: var(--color-pending);
      margin-bottom: 4px;
    }

    .status-value {
      display: block;
      font-size: 1.125rem;
    }

    @media (prefers-reduced-motion: reduce) {
      .status-dot.online {
        animation: none;
      }
      
      .status-card {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>PR45 Readiness Test</h1>
    <div class="status-card">
      <div class="status-indicator">
        <div class="status-dot pending" id="statusDot"></div>
        <div class="status-text">
          <span class="status-label">Server Status</span>
          <span class="status-value" id="statusText">Checking...</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function checkHealth() {
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      try {
        const response = await fetch('/api/health');
        const data = await response.json();

        if (data.ok) {
          statusDot.className = 'status-dot online';
          statusText.textContent = 'Server Online';
        } else {
          statusDot.className = 'status-dot offline';
          statusText.textContent = 'Server Error';
        }
      } catch (error) {
        statusDot.className = 'status-dot offline';
        statusText.textContent = 'Server Offline';
      }
    }

    // Check health on page load
    checkHealth();
  </script>
</body>
</html>
