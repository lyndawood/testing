<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git-native notes</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --bg: #ffffff;
      --surface: #f8fafc;
      --text: #0f172a;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --radius: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #3b82f6;
        --primary-dark: #60a5fa;
        --bg: #0f172a;
        --surface: #1e293b;
        --text: #f1f5f9;
        --text-secondary: #94a3b8;
        --border: #334155;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: var(--spacing-md);
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: var(--spacing-lg) 0;
    }

    h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 700;
      margin-bottom: var(--spacing-xl);
      color: var(--text);
    }

    .note-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-xl);
    }

    .form-group {
      margin-bottom: var(--spacing-md);
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: var(--spacing-sm);
      color: var(--text);
    }

    #noteInput {
      width: 100%;
      padding: var(--spacing-md);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 1rem;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #noteInput:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    @media (prefers-reduced-motion: reduce) {
      #noteInput {
        transition: none;
      }
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: var(--spacing-md) var(--spacing-lg);
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button:active {
      transform: translateY(1px);
    }

    button:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (prefers-reduced-motion: reduce) {
      button {
        transition: none;
      }
    }

    .notes-section {
      margin-top: var(--spacing-xl);
    }

    .notes-section h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: var(--spacing-md);
      color: var(--text);
    }

    .notes-list {
      list-style: none;
    }

    .note-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--spacing-md);
      margin-bottom: var(--spacing-md);
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .note-item {
        animation: none;
      }
    }

    .note-text {
      color: var(--text);
      margin-bottom: var(--spacing-sm);
      word-wrap: break-word;
    }

    .note-meta {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .empty-state {
      text-align: center;
      padding: var(--spacing-xl);
      color: var(--text-secondary);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: var(--spacing-md);
      opacity: 0.5;
    }

    .status-message {
      padding: var(--spacing-md);
      border-radius: var(--radius);
      margin-bottom: var(--spacing-md);
      font-size: 0.875rem;
    }

    .status-message.error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    @media (prefers-color-scheme: dark) {
      .status-message.error {
        background: #7f1d1d;
        color: #fecaca;
        border-color: #991b1b;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: var(--spacing-sm);
      }

      .container {
        padding: var(--spacing-md) 0;
      }

      .note-form {
        padding: var(--spacing-md);
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Git-native notes</h1>

    <section class="note-form" aria-label="Add new note">
      <form id="noteForm">
        <div class="form-group">
          <label for="noteInput">Note</label>
          <input 
            type="text" 
            id="noteInput" 
            name="note" 
            required 
            autocomplete="off"
            aria-describedby="noteHelp"
          >
        </div>
        <button type="submit" id="addButton">Add note</button>
      </form>
      <div id="statusMessage" role="status" aria-live="polite"></div>
    </section>

    <section class="notes-section" aria-label="Notes list">
      <h2>Your notes</h2>
      <ul id="notesList" class="notes-list" role="list">
        <li class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="12" y1="18" x2="12" y2="12"></line>
            <line x1="9" y1="15" x2="15" y2="15"></line>
          </svg>
          <p>No notes yet. Add your first note above.</p>
        </li>
      </ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
