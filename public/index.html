<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fieldnote - Your Everyday Notebook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-sidebar-bg: #1a4d47;
      --color-main-bg: #e8e4d0;
      --color-card-gold: #d4a574;
      --color-card-green: #c9d9a3;
      --color-card-peach: #d9c9b8;
      --color-card-blue: #b8d4e0;
      --color-button: #c85a3a;
      --color-heading: #2d5a54;
      --color-text: #3a3a3a;
      --color-text-light: #6a6a6a;
      --color-sidebar-text: #e8e4d0;
      
      --font-heading: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
      
      --spacing-unit: 8px;
      --radius: 12px;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: var(--font-body);
      color: var(--color-text);
      line-height: 1.6;
      display: flex;
      min-height: 100vh;
      background: var(--color-main-bg);
    }
    
    /* Sidebar */
    .sidebar {
      width: 236px;
      background: var(--color-sidebar-bg);
      color: var(--color-sidebar-text);
      padding: calc(var(--spacing-unit) * 4);
      display: flex;
      flex-direction: column;
      gap: calc(var(--spacing-unit) * 3);
      flex-shrink: 0;
    }
    
    .logo {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: 0.02em;
      margin-bottom: calc(var(--spacing-unit) * 2);
    }
    
    .tagline {
      font-size: 0.9rem;
      opacity: 0.85;
      line-height: 1.5;
    }
    
    .nav {
      display: flex;
      flex-direction: column;
      gap: calc(var(--spacing-unit) * 2);
      margin-top: calc(var(--spacing-unit) * 4);
    }
    
    .nav-item {
      padding: calc(var(--spacing-unit) * 2);
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.2s ease;
      font-size: 1rem;
    }
    
    .nav-item.active {
      background: rgba(255, 255, 255, 0.15);
    }
    
    .nav-item:hover:not(.active) {
      background: rgba(255, 255, 255, 0.08);
    }
    
    .sidebar-footer {
      margin-top: auto;
      padding-top: calc(var(--spacing-unit) * 4);
      font-size: 0.75rem;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    /* Main content */
    .main {
      flex: 1;
      padding: calc(var(--spacing-unit) * 6) calc(var(--spacing-unit) * 8);
      overflow-y: auto;
    }
    
    .header {
      margin-bottom: calc(var(--spacing-unit) * 6);
    }
    
    .header-top {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-heading);
      font-weight: 600;
      margin-bottom: calc(var(--spacing-unit) * 2);
    }
    
    .header-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: calc(var(--spacing-unit) * 4);
      margin-bottom: calc(var(--spacing-unit) * 2);
    }
    
    .header-title {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: clamp(2rem, 4vw, 3rem);
      color: var(--color-heading);
      line-height: 1.2;
    }
    
    .btn-new-note {
      background: var(--color-button);
      color: white;
      border: none;
      padding: calc(var(--spacing-unit) * 2) calc(var(--spacing-unit) * 4);
      border-radius: var(--radius);
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: calc(var(--spacing-unit));
    }
    
    .btn-new-note:hover {
      background: #b34d2f;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(200, 90, 58, 0.3);
    }
    
    .btn-new-note:active {
      transform: translateY(0);
    }
    
    .header-subtitle {
      color: var(--color-text-light);
      font-size: 1.1rem;
    }
    
    .search-box {
      margin-bottom: calc(var(--spacing-unit) * 4);
    }
    
    .search-input {
      width: 100%;
      padding: calc(var(--spacing-unit) * 2) calc(var(--spacing-unit) * 3);
      border: 2px solid rgba(45, 90, 84, 0.15);
      border-radius: var(--radius);
      font-family: var(--font-body);
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.6);
      color: var(--color-text);
      transition: all 0.2s ease;
    }
    
    .search-input:focus {
      outline: none;
      border-color: var(--color-heading);
      background: white;
    }
    
    .search-input::placeholder {
      color: var(--color-text-light);
      opacity: 0.7;
    }
    
    /* Notes grid */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: calc(var(--spacing-unit) * 3);
      margin-bottom: calc(var(--spacing-unit) * 4);
    }
    
    .note-card {
      background: var(--color-card-gold);
      padding: calc(var(--spacing-unit) * 4);
      border-radius: var(--radius);
      transition: all 0.2s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: calc(var(--spacing-unit) * 2);
    }
    
    .note-card:nth-child(4n+1) {
      background: var(--color-card-gold);
    }
    
    .note-card:nth-child(4n+2) {
      background: var(--color-card-green);
    }
    
    .note-card:nth-child(4n+3) {
      background: var(--color-card-peach);
    }
    
    .note-card:nth-child(4n+4) {
      background: var(--color-card-blue);
    }
    
    .note-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(45, 90, 84, 0.15);
    }
    
    .note-category {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      color: var(--color-heading);
      opacity: 0.8;
    }
    
    .note-title {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--color-heading);
      line-height: 1.3;
    }
    
    .note-body {
      color: var(--color-text);
      font-size: 1rem;
      line-height: 1.6;
    }
    
    .note-timestamp {
      font-size: 0.85rem;
      color: var(--color-text-light);
      margin-top: auto;
    }
    
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(26, 77, 71, 0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: calc(var(--spacing-unit) * 3);
    }
    
    .modal.active {
      display: flex;
    }
    
    .modal-content {
      background: var(--color-main-bg);
      padding: calc(var(--spacing-unit) * 6);
      border-radius: calc(var(--radius) * 1.5);
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    .modal-header {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 2rem;
      color: var(--color-heading);
      margin-bottom: calc(var(--spacing-unit) * 4);
    }
    
    .form-group {
      margin-bottom: calc(var(--spacing-unit) * 3);
    }
    
    .form-label {
      display: block;
      font-weight: 600;
      color: var(--color-heading);
      margin-bottom: calc(var(--spacing-unit));
      font-size: 0.95rem;
    }
    
    .form-input,
    .form-textarea {
      width: 100%;
      padding: calc(var(--spacing-unit) * 2);
      border: 2px solid rgba(45, 90, 84, 0.2);
      border-radius: var(--radius);
      font-family: var(--font-body);
      font-size: 1rem;
      background: white;
      color: var(--color-text);
      transition: border-color 0.2s ease;
    }
    
    .form-input:focus,
    .form-textarea:focus {
      outline: none;
      border-color: var(--color-heading);
    }
    
    .form-textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.6;
    }
    
    .form-actions {
      display: flex;
      gap: calc(var(--spacing-unit) * 2);
      justify-content: flex-end;
      margin-top: calc(var(--spacing-unit) * 4);
    }
    
    .btn {
      padding: calc(var(--spacing-unit) * 2) calc(var(--spacing-unit) * 4);
      border-radius: var(--radius);
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }
    
    .btn-primary {
      background: var(--color-button);
      color: white;
    }
    
    .btn-primary:hover {
      background: #b34d2f;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(200, 90, 58, 0.3);
    }
    
    .btn-secondary {
      background: rgba(45, 90, 84, 0.1);
      color: var(--color-heading);
    }
    
    .btn-secondary:hover {
      background: rgba(45, 90, 84, 0.2);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      
      .sidebar {
        width: 100%;
        padding: calc(var(--spacing-unit) * 3);
      }
      
      .nav {
        flex-direction: row;
        overflow-x: auto;
      }
      
      .sidebar-footer {
        display: none;
      }
      
      .main {
        padding: calc(var(--spacing-unit) * 4);
      }
      
      .notes-grid {
        grid-template-columns: 1fr;
      }
      
      .header-title-row {
        flex-direction: column;
        align-items: stretch;
      }
    }
    
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div>
      <h1 class="logo">FIELDNOTE</h1>
      <p class="tagline">A little room to think.</p>
    </div>
    
    <nav class="nav">
      <div class="nav-item active">All notes</div>
      <div class="nav-item">Ideas</div>
      <div class="nav-item">Archive</div>
    </nav>
    
    <div class="sidebar-footer">
      Your personal<br>idea garden
    </div>
  </aside>
  
  <main class="main">
    <header class="header">
      <div class="header-top">Your everyday notebook</div>
      <div class="header-title-row">
        <h2 class="header-title">Small notes. Big ideas.</h2>
        <button class="btn-new-note" id="newNoteBtn">
          <span>+</span>
          <span>New note</span>
        </button>
      </div>
      <p class="header-subtitle">Keep the good thoughts close.</p>
    </header>
    
    <div class="search-box">
      <input 
        type="text" 
        class="search-input" 
        placeholder="Search your notes..."
        id="searchInput"
      >
    </div>
    
    <div class="notes-grid" id="notesGrid">
      <!-- Notes will be inserted here -->
    </div>
  </main>
  
  <!-- New Note Modal -->
  <div class="modal" id="noteModal">
    <div class="modal-content">
      <h3 class="modal-header">Create a new note</h3>
      <form id="noteForm">
        <div class="form-group">
          <label class="form-label" for="noteTitle">Title</label>
          <input 
            type="text" 
            class="form-input" 
            id="noteTitle" 
            required
            placeholder="Give your note a title"
          >
        </div>
        <div class="form-group">
          <label class="form-label" for="noteBody">Note</label>
          <textarea 
            class="form-textarea" 
            id="noteBody" 
            required
            placeholder="What's on your mind?"
          ></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save note</button>
        </div>
      </form>
    </div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
