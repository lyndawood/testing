<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PR45 Readiness Test</title>
  <style>
    :root {
      --color-bg: #ffffff;
      --color-text: #1a1a1a;
      --color-card: #f8f9fa;
      --color-border: #e1e4e8;
      --color-success: #28a745;
      --color-error: #dc3545;
      --color-pending: #6c757d;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #0d1117;
        --color-text: #e6edf3;
        --color-card: #161b22;
        --color-border: #30363d;
        --color-success: #3fb950;
        --color-error: #f85149;
        --color-pending: #8b949e;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 480px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    footer {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--color-border);
      text-align: center;
      font-size: 0.875rem;
      color: var(--color-pending);
    }

    h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 600;
      margin-bottom: 32px;
      text-align: center;
      letter-spacing: -0.02em;
    }

    .status-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      transition: box-shadow 0.2s ease;
    }

    .status-card:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 1.125rem;
      font-weight: 500;
    }

    .status-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
    }

    .status-dot.online {
      background: var(--color-success);
      box-shadow: 0 0 0 4px rgba(40, 167, 69, 0.2);
      animation: pulse 2s ease-in-out infinite;
    }

    .status-dot.offline {
      background: var(--color-error);
      box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.2);
    }

    .status-dot.pending {
      background: var(--color-pending);
      box-shadow: 0 0 0 4px rgba(108, 117, 125, 0.2);
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.6;
      }
    }

    .status-text {
      flex: 1;
    }

    .status-label {
      display: block;
      font-size: 0.875rem;
      color: var(--color-pending);
      margin-bottom: 4px;
    }

    .status-value {
      display: block;
      font-size: 1.125rem;
    }

    .status-footer {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .last-checked {
      font-size: 0.875rem;
      color: var(--color-pending);
    }

    .refresh-btn {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .refresh-btn:hover:not(:disabled) {
      background: var(--color-border);
      transform: translateY(-1px);
    }

    .refresh-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .refresh-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .refresh-btn:focus-visible {
      outline: 2px solid var(--color-success);
      outline-offset: 2px;
    }

    .error-message {
      margin-top: 16px;
      padding: 12px 16px;
      background: rgba(220, 53, 69, 0.1);
      border: 1px solid var(--color-error);
      border-radius: 6px;
      color: var(--color-error);
      font-size: 0.875rem;
      display: none;
    }

    .error-message[aria-hidden="false"] {
      display: block;
    }

    @media (prefers-reduced-motion: reduce) {
      .status-dot.online {
        animation: none;
        opacity: 1;
      }
      
      .status-card,
      .refresh-btn {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>PR45 Readiness Test</h1>
    <div class="status-card">
      <div class="status-indicator">
        <div class="status-dot pending" id="statusDot" role="status" aria-live="polite"></div>
        <div class="status-text">
          <span class="status-label">Server Status</span>
          <span class="status-value" id="statusText">Checking...</span>
        </div>
      </div>
      <div class="error-message" id="errorMessage" role="alert" aria-hidden="true"></div>
      <div class="status-footer">
        <span class="last-checked" id="lastChecked">Never checked</span>
        <button class="refresh-btn" id="refreshBtn" aria-label="Refresh server status">
          Refresh Status
        </button>
      </div>
    </div>
    <footer>PR45 live preview check</footer>
  </div>

  <script>
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const lastChecked = document.getElementById('lastChecked');
    const refreshBtn = document.getElementById('refreshBtn');
    const errorMessage = document.getElementById('errorMessage');

    function formatTime(date) {
      return date.toLocaleTimeString('en-US', { 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit' 
      });
    }

    async function checkHealth() {
      // Disable button and show checking state
      refreshBtn.disabled = true;
      statusDot.className = 'status-dot pending';
      statusText.textContent = 'Checking...';
      errorMessage.setAttribute('aria-hidden', 'true');

      try {
        const response = await fetch('/api/health');
        
        if (!response.ok) {
          throw new Error(`Server returned ${response.status}`);
        }

        const data = await response.json();

        if (data.ok) {
          statusDot.className = 'status-dot online';
          statusText.textContent = 'Server Online';
          errorMessage.setAttribute('aria-hidden', 'true');
        } else {
          statusDot.className = 'status-dot offline';
          statusText.textContent = 'Server Error';
          errorMessage.textContent = 'Health check returned an unexpected response.';
          errorMessage.setAttribute('aria-hidden', 'false');
        }
      } catch (error) {
        statusDot.className = 'status-dot offline';
        statusText.textContent = 'Server Offline';
        errorMessage.textContent = `Unable to reach the server: ${error.message}`;
        errorMessage.setAttribute('aria-hidden', 'false');
      } finally {
        // Update last checked time and re-enable button
        const now = new Date();
        lastChecked.textContent = `Last checked: ${formatTime(now)}`;
        refreshBtn.disabled = false;
      }
    }

    // Attach click handler to refresh button
    refreshBtn.addEventListener('click', checkHealth);

    // Check health on page load
    checkHealth();
  </script>
</body>
</html>
