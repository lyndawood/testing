<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Notes</title>
  <style>
    :root {
      --color-primary: #0d9488;
      --color-primary-dark: #0f766e;
      --color-bg: #ffffff;
      --color-surface: #f8fafc;
      --color-border: #e2e8f0;
      --color-text: #1e293b;
      --color-text-secondary: #475569;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --radius: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #0f172a;
        --color-surface: #1e293b;
        --color-border: #334155;
        --color-text: #f1f5f9;
        --color-text-secondary: #94a3b8;
      }

      .btn-secondary:hover {
        background: #475569;
        color: white;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
      padding: clamp(1rem, 5vw, 2rem);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 42rem;
      margin: 0 auto;
    }

    h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--color-text);
    }

    .subtitle {
      color: var(--color-text-secondary);
      font-size: 0.9375rem;
      margin-bottom: 2rem;
    }

    .note-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: clamp(1.25rem, 3vw, 1.5rem);
      box-shadow: var(--shadow-sm);
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
      color: var(--color-text);
    }

    textarea {
      width: 100%;
      min-height: 16rem;
      padding: 0.75rem;
      font-family: inherit;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--color-text);
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      resize: vertical;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    @media (prefers-reduced-motion: no-preference) {
      textarea {
        transition: border-color 0.2s, box-shadow 0.2s;
      }
    }

    textarea:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1);
    }

    .button-group {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    button {
      padding: 0.625rem 1.5rem;
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    @media (prefers-reduced-motion: no-preference) {
      button {
        transition: background-color 0.2s, transform 0.1s;
      }
    }

    button:focus {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    button:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--color-primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--color-primary-dark);
    }

    .btn-secondary {
      background: var(--color-border);
      color: var(--color-text);
    }

    .btn-secondary:hover {
      background: var(--color-text-secondary);
      color: white;
    }

    .status {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s;
    }

    @media (prefers-reduced-motion: no-preference) {
      .status {
        transition: opacity 0.3s;
      }
    }

    .status.show {
      opacity: 1;
    }

    .status.success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    @media (prefers-color-scheme: dark) {
      .status.success {
        background: #14532d;
        color: #bbf7d0;
        border-color: #166534;
      }
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      color: var(--color-text-secondary);
      font-size: 0.875rem;
    }

    @media (max-width: 640px) {
      textarea {
        min-height: 12rem;
      }

      .button-group {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Quick Notes</h1>
      <p class="subtitle">Your notes are saved automatically in your browser</p>
    </header>

    <main>
      <div class="note-card">
        <label for="noteText">Your Notes</label>
        <textarea 
          id="noteText" 
          placeholder="Start typing your notes here..."
          aria-label="Note text area"
        ></textarea>
        
        <div class="button-group">
          <button 
            type="button" 
            class="btn-primary" 
            id="saveBtn"
            aria-label="Save notes"
          >
            Save
          </button>
          <button 
            type="button" 
            class="btn-secondary" 
            id="clearBtn"
            aria-label="Clear notes"
          >
            Clear
          </button>
        </div>

        <div id="status" class="status" role="status" aria-live="polite"></div>
      </div>
    </main>

    <footer>
      <p>Notes are stored locally in your browser</p>
    </footer>
  </div>

  <script>
    const noteText = document.getElementById('noteText');
    const saveBtn = document.getElementById('saveBtn');
    const clearBtn = document.getElementById('clearBtn');
    const status = document.getElementById('status');
    const STORAGE_KEY = 'quickNotes';

    // Load saved notes on page load
    function loadNotes() {
      const savedNotes = localStorage.getItem(STORAGE_KEY);
      if (savedNotes) {
        noteText.value = savedNotes;
      }
    }

    // Save notes to localStorage
    function saveNotes() {
      const notes = noteText.value;
      localStorage.setItem(STORAGE_KEY, notes);
      showStatus('Notes saved successfully!');
    }

    // Clear notes
    function clearNotes() {
      if (noteText.value && !confirm('Are you sure you want to clear all notes?')) {
        return;
      }
      noteText.value = '';
      localStorage.removeItem(STORAGE_KEY);
      showStatus('Notes cleared');
      noteText.focus();
    }

    // Show status message
    function showStatus(message) {
      status.textContent = message;
      status.classList.add('show', 'success');
      
      setTimeout(() => {
        status.classList.remove('show');
      }, 2000);
    }

    // Event listeners
    saveBtn.addEventListener('click', saveNotes);
    clearBtn.addEventListener('click', clearNotes);

    // Optional: Save on Ctrl/Cmd + S
    noteText.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        saveNotes();
      }
    });

    // Load notes when page loads
    loadNotes();
  </script>
</body>
</html>
