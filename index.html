<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea Matching Game ☕</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-decoration">
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
        <div class="bubble bubble-4"></div>
    </div>

    <div class="container">
        <header>
            <div class="header-decoration">
                <span class="tea-leaf">🍃</span>
                <h1>Tea Matching Game</h1>
                <span class="tea-leaf">🍃</span>
            </div>
            <p class="subtitle">Find all the matching pairs! ☕</p>
            
            <div class="stats">
                <div class="stat">
                    <div class="stat-icon">🎯</div>
                    <div class="stat-content">
                        <span class="label">Moves</span>
                        <span class="value" id="moves">0</span>
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-icon">✨</div>
                    <div class="stat-content">
                        <span class="label">Matches</span>
                        <span class="value" id="matches">0</span>
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-icon">⏱️</div>
                    <div class="stat-content">
                        <span class="label">Time</span>
                        <span class="value" id="timer">0s</span>
                    </div>
                </div>
            </div>
        </header>

        <main>
            <div class="game-board" id="gameBoard"></div>
        </main>

        <footer>
            <button class="btn btn-primary" id="resetBtn">
                <span class="btn-icon">🔄</span>
                New Game
            </button>
            <button class="btn btn-secondary" id="hintBtn">
                <span class="btn-icon">💡</span>
                Hint
            </button>
        </footer>

        <div class="modal" id="winModal">
            <div class="modal-content">
                <div class="confetti"></div>
                <h2>🎉 You Won! 🎉</h2>
                <p class="win-message">Amazing job! You're a tea master! ☕✨</p>
                <p id="winStats"></p>
                <button class="btn btn-primary" onclick="location.reload()">
                    <span class="btn-icon">🎮</span>
                    Play Again
                </button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
