<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea Themed Matching Card Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍵 Tea Matching Game 🍵</h1>
            <div class="stats">
                <div class="stat">
                    <span class="label">Moves:</span>
                    <span class="value" id="moves">0</span>
                </div>
                <div class="stat">
                    <span class="label">Matches:</span>
                    <span class="value" id="matches">0</span>
                </div>
                <div class="stat">
                    <span class="label">Time:</span>
                    <span class="value" id="timer">0s</span>
                </div>
            </div>
        </header>

        <main>
            <div class="game-board" id="gameBoard"></div>
        </main>

        <footer>
            <button class="btn btn-primary" id="resetBtn">New Game</button>
            <button class="btn btn-secondary" id="hintBtn">Hint</button>
        </footer>

        <div class="modal" id="winModal">
            <div class="modal-content">
                <h2>🎉 You Won! 🎉</h2>
                <p id="winStats"></p>
                <button class="btn btn-primary" onclick="location.reload()">Play Again</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
