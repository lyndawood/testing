<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        h1 {
            margin-bottom: 1rem;
            font-size: 2rem;
        }

        p {
            margin-bottom: 1rem;
        }

        footer {
            background-color: #333;
            color: #fff;
            padding: 2rem;
            text-align: center;
            margin-top: auto;
        }

        footer a {
            color: #fff;
            text-decoration: none;
            border-bottom: 1px solid #fff;
            transition: opacity 0.2s;
        }

        footer a:hover {
            opacity: 0.8;
        }

        @media (prefers-reduced-motion: reduce) {
            footer a {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Welcome</h1>
        <p>This is a simple testing example project.</p>
    </main>

    <footer>
        <p>Contact: <a href="mailto:s2-test@example.com">s2-test@example.com</a></p>
    </footer>
</body>
</html>
