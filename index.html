<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Dashboard</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --primary-light: #3b82f6;
            --bg: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-card: #ffffff;
            --text: #1e293b;
            --text-secondary: #475569;
            --border: #e2e8f0;
            --shadow: rgba(0, 0, 0, 0.1);
            --shadow-lg: rgba(0, 0, 0, 0.15);
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --radius: 8px;
            --radius-lg: 12px;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --text: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border: #334155;
            --shadow: rgba(0, 0, 0, 0.3);
            --shadow-lg: rgba(0, 0, 0, 0.5);
            --success: #10b981;
            --warning: #fbbf24;
            --danger: #f87171;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0f172a;
                --bg-secondary: #1e293b;
                --bg-card: #1e293b;
                --text: #f1f5f9;
                --text-secondary: #cbd5e1;
                --border: #334155;
                --shadow: rgba(0, 0, 0, 0.3);
                --shadow-lg: rgba(0, 0, 0, 0.5);
                --success: #10b981;
                --warning: #fbbf24;
                --danger: #f87171;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: var(--spacing-xl) var(--spacing-lg);
            box-shadow: 0 4px 6px var(--shadow);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .theme-toggle:focus {
            outline: 2px solid white;
            outline-offset: 2px;
        }

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--spacing-xl) var(--spacing-lg);
        }

        .controls {
            background: var(--bg-card);
            padding: var(--spacing-lg);
            border-radius: var(--radius-lg);
            box-shadow: 0 2px 4px var(--shadow);
            margin-bottom: var(--spacing-xl);
            border: 1px solid var(--border);
        }

        .controls-row {
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-md) var(--spacing-sm) 40px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.875rem;
            background: var(--bg);
            color: var(--text);
            transition: border-color 0.2s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search-icon {
            position: absolute;
            left: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        .filter-group {
            display: flex;
            gap: var(--spacing-sm);
            align-items: center;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        select {
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.875rem;
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: 0 2px 4px var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px var(--shadow-lg);
        }

        .card:focus {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: var(--spacing-md);
            gap: var(--spacing-sm);
        }

        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text);
            line-height: 1.4;
        }

        .card-priority {
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        .priority-high {
            background: rgba(220, 38, 38, 0.15);
            color: #991b1b;
        }

        .priority-medium {
            background: rgba(217, 119, 6, 0.15);
            color: #92400e;
        }

        .priority-low {
            background: rgba(5, 150, 105, 0.15);
            color: #065f46;
        }

        .card-description {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: var(--spacing-md);
            line-height: 1.6;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--border);
        }

        .card-status {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-todo .status-dot {
            background: var(--text-secondary);
        }

        .status-in-progress .status-dot {
            background: var(--primary);
        }

        .status-done .status-dot {
            background: var(--success);
        }

        .card-date {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .empty-state {
            text-align: center;
            padding: var(--spacing-xl) var(--spacing-lg);
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: var(--spacing-md);
            opacity: 0.5;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 25px -5px var(--shadow-lg);
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }

        .modal-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: var(--spacing-xs);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
            transition: background 0.2s ease;
        }

        .modal-close:hover {
            background: var(--bg-secondary);
        }

        .modal-close:focus {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .modal-body {
            padding: var(--spacing-lg);
        }

        .form-group {
            margin-bottom: var(--spacing-md);
        }

        .form-group label {
            display: block;
            margin-bottom: var(--spacing-xs);
            font-weight: 500;
            color: var(--text);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.875rem;
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .modal-footer {
            padding: var(--spacing-lg);
            border-top: 1px solid var(--border);
            display: flex;
            gap: var(--spacing-sm);
            justify-content: flex-end;
        }

        .btn {
            padding: var(--spacing-sm) var(--spacing-lg);
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-primary:focus {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-secondary:focus {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        [data-theme="dark"] .priority-high {
            background: rgba(248, 113, 113, 0.2);
            color: #fca5a5;
        }

        [data-theme="dark"] .priority-medium {
            background: rgba(251, 191, 36, 0.2);
            color: #fcd34d;
        }

        [data-theme="dark"] .priority-low {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .priority-high {
                background: rgba(248, 113, 113, 0.2);
                color: #fca5a5;
            }

            :root:not([data-theme="light"]) .priority-medium {
                background: rgba(251, 191, 36, 0.2);
                color: #fcd34d;
            }

            :root:not([data-theme="light"]) .priority-low {
                background: rgba(16, 185, 129, 0.2);
                color: #6ee7b7;
            }
        }

        @media (max-width: 768px) {
            .controls-row {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group {
                flex-direction: column;
                align-items: stretch;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Project Dashboard</h1>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <span id="themeLabel">Dark Mode</span>
            </button>
        </div>
    </header>

    <main>
        <div class="controls">
            <div class="controls-row">
                <div class="search-box">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input type="search" id="searchInput" placeholder="Search projects..." aria-label="Search projects">
                </div>
                <div class="filter-group">
                    <label for="sortSelect">Sort by:</label>
                    <select id="sortSelect" aria-label="Sort cards">
                        <option value="name">Name</option>
                        <option value="priority">Priority</option>
                        <option value="status">Status</option>
                        <option value="date">Date</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="priorityFilter">Priority:</label>
                    <select id="priorityFilter" aria-label="Filter by priority">
                        <option value="all">All</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="statusFilter">Status:</label>
                    <select id="statusFilter" aria-label="Filter by status">
                        <option value="all">All</option>
                        <option value="todo">To Do</option>
                        <option value="in-progress">In Progress</option>
                        <option value="done">Done</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="cards-grid" id="cardsGrid" role="list">
            <!-- Cards will be inserted here -->
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <p>No projects found matching your filters.</p>
        </div>
    </main>

    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Edit Project</h2>
                <button class="modal-close" id="modalClose" aria-label="Close modal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <form id="editForm">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="editName">Project Name</label>
                        <input type="text" id="editName" required>
                    </div>
                    <div class="form-group">
                        <label for="editDescription">Description</label>
                        <textarea id="editDescription" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="editPriority">Priority</label>
                        <select id="editPriority" required>
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="editStatus">Status</label>
                        <select id="editStatus" required>
                            <option value="todo">To Do</option>
                            <option value="in-progress">In Progress</option>
                            <option value="done">Done</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Initial data
        const defaultCards = [
            {
                id: 1,
                name: 'User Authentication System',
                description: 'Implement secure login and registration with JWT tokens and password hashing.',
                priority: 'high',
                status: 'in-progress',
                date: '2024-01-15'
            },
            {
                id: 2,
                name: 'Dashboard Analytics',
                description: 'Create interactive charts and graphs to visualize key performance metrics.',
                priority: 'high',
                status: 'todo',
                date: '2024-01-20'
            },
            {
                id: 3,
                name: 'API Documentation',
                description: 'Write comprehensive API documentation with examples and best practices.',
                priority: 'medium',
                status: 'in-progress',
                date: '2024-01-18'
            },
            {
                id: 4,
                name: 'Mobile Responsive Design',
                description: 'Optimize the interface for mobile devices and tablets with touch-friendly controls.',
                priority: 'high',
                status: 'done',
                date: '2024-01-10'
            },
            {
                id: 5,
                name: 'Database Optimization',
                description: 'Improve query performance and add proper indexing to reduce load times.',
                priority: 'medium',
                status: 'todo',
                date: '2024-01-22'
            },
            {
                id: 6,
                name: 'Email Notifications',
                description: 'Set up automated email notifications for important events and updates.',
                priority: 'low',
                status: 'todo',
                date: '2024-01-25'
            },
            {
                id: 7,
                name: 'Search Functionality',
                description: 'Implement full-text search with filters and advanced query options.',
                priority: 'medium',
                status: 'in-progress',
                date: '2024-01-16'
            },
            {
                id: 8,
                name: 'Unit Test Coverage',
                description: 'Increase test coverage to 80% with comprehensive unit and integration tests.',
                priority: 'medium',
                status: 'in-progress',
                date: '2024-01-12'
            },
            {
                id: 9,
                name: 'Performance Monitoring',
                description: 'Add monitoring tools to track application performance and error rates.',
                priority: 'low',
                status: 'todo',
                date: '2024-01-28'
            },
            {
                id: 10,
                name: 'User Feedback System',
                description: 'Create a feedback form and rating system for users to share their experience.',
                priority: 'low',
                status: 'done',
                date: '2024-01-08'
            }
        ];

        // State
        let cards = [];
        let currentEditId = null;

        // Initialize
        function init() {
            loadCards();
            setupEventListeners();
            loadTheme();
            renderCards();
        }

        // Load cards from localStorage or use defaults
        function loadCards() {
            const stored = localStorage.getItem('dashboardCards');
            cards = stored ? JSON.parse(stored) : defaultCards;
        }

        // Save cards to localStorage
        function saveCards() {
            localStorage.setItem('dashboardCards', JSON.stringify(cards));
        }

        // Theme management
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                updateThemeLabel(savedTheme);
            } else {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (prefersDark) {
                    updateThemeLabel('dark');
                }
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeLabel(newTheme);
        }

        function updateThemeLabel(theme) {
            const label = document.getElementById('themeLabel');
            label.textContent = theme === 'dark' ? 'Light Mode' : 'Dark Mode';
        }

        // Event listeners
        function setupEventListeners() {
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            document.getElementById('searchInput').addEventListener('input', renderCards);
            document.getElementById('sortSelect').addEventListener('change', renderCards);
            document.getElementById('priorityFilter').addEventListener('change', renderCards);
            document.getElementById('statusFilter').addEventListener('change', renderCards);
            document.getElementById('modalClose').addEventListener('click', closeModal);
            document.getElementById('cancelBtn').addEventListener('click', closeModal);
            document.getElementById('modalOverlay').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeModal();
            });
            document.getElementById('editForm').addEventListener('submit', handleFormSubmit);
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && document.getElementById('modalOverlay').classList.contains('active')) {
                    closeModal();
                }
            });
        }

        // Filter and sort cards
        function getFilteredAndSortedCards() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const priorityFilter = document.getElementById('priorityFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            const sortBy = document.getElementById('sortSelect').value;

            let filtered = cards.filter(card => {
                const matchesSearch = card.name.toLowerCase().includes(searchTerm) || 
                                    card.description.toLowerCase().includes(searchTerm);
                const matchesPriority = priorityFilter === 'all' || card.priority === priorityFilter;
                const matchesStatus = statusFilter === 'all' || card.status === statusFilter;
                return matchesSearch && matchesPriority && matchesStatus;
            });

            // Sort
            filtered.sort((a, b) => {
                switch (sortBy) {
                    case 'name':
                        return a.name.localeCompare(b.name);
                    case 'priority':
                        const priorityOrder = { high: 0, medium: 1, low: 2 };
                        return priorityOrder[a.priority] - priorityOrder[b.priority];
                    case 'status':
                        const statusOrder = { 'in-progress': 0, 'todo': 1, 'done': 2 };
                        return statusOrder[a.status] - statusOrder[b.status];
                    case 'date':
                        return new Date(b.date) - new Date(a.date);
                    default:
                        return 0;
                }
            });

            return filtered;
        }

        // Render cards
        function renderCards() {
            const filtered = getFilteredAndSortedCards();
            const grid = document.getElementById('cardsGrid');
            const emptyState = document.getElementById('emptyState');

            if (filtered.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            emptyState.style.display = 'none';

            grid.innerHTML = filtered.map(card => `
                <div class="card" role="listitem" tabindex="0" data-id="${card.id}" aria-label="${card.name}">
                    <div class="card-header">
                        <h3 class="card-title">${escapeHtml(card.name)}</h3>
                        <span class="card-priority priority-${card.priority}">${card.priority}</span>
                    </div>
                    <p class="card-description">${escapeHtml(card.description)}</p>
                    <div class="card-footer">
                        <div class="card-status status-${card.status}">
                            <span class="status-dot"></span>
                            <span>${formatStatus(card.status)}</span>
                        </div>
                        <span class="card-date">${formatDate(card.date)}</span>
                    </div>
                </div>
            `).join('');

            // Add click handlers
            grid.querySelectorAll('.card').forEach(cardEl => {
                cardEl.addEventListener('click', () => openEditModal(parseInt(cardEl.dataset.id)));
                cardEl.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        openEditModal(parseInt(cardEl.dataset.id));
                    }
                });
            });
        }

        // Modal functions
        function openEditModal(cardId) {
            const card = cards.find(c => c.id === cardId);
            if (!card) return;

            currentEditId = cardId;
            document.getElementById('editName').value = card.name;
            document.getElementById('editDescription').value = card.description;
            document.getElementById('editPriority').value = card.priority;
            document.getElementById('editStatus').value = card.status;

            const modal = document.getElementById('modalOverlay');
            modal.classList.add('active');
            document.getElementById('editName').focus();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            currentEditId = null;
            document.getElementById('editForm').reset();
        }

        function handleFormSubmit(e) {
            e.preventDefault();

            const card = cards.find(c => c.id === currentEditId);
            if (!card) return;

            card.name = document.getElementById('editName').value;
            card.description = document.getElementById('editDescription').value;
            card.priority = document.getElementById('editPriority').value;
            card.status = document.getElementById('editStatus').value;

            saveCards();
            renderCards();
            closeModal();
        }

        // Utility functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatStatus(status) {
            return status.split('-').map(word => 
                word.charAt(0).toUpperCase() + word.slice(1)
            ).join(' ');
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        // Start the app
        init();
    </script>
</body>
</html>
