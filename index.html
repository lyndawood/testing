<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matching Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎮 Matching Game</h1>
      <p class="subtitle">Find all the matching pairs!</p>
    </header>

    <div class="stats">
      <div class="stat-item">
        <span class="stat-label">Moves:</span>
        <span class="stat-value" id="moves">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Matches:</span>
        <span class="stat-value" id="matches">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Time:</span>
        <span class="stat-value" id="timer">0s</span>
      </div>
    </div>

    <div class="game-board" id="gameBoard"></div>

    <div class="controls">
      <button class="btn btn-primary" id="resetBtn">New Game</button>
      <button class="btn btn-secondary" id="hintBtn">Hint</button>
    </div>

    <div class="modal" id="winModal">
      <div class="modal-content">
        <h2>🎉 You Won!</h2>
        <p id="winStats"></p>
        <button class="btn btn-primary" id="playAgainBtn">Play Again</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
