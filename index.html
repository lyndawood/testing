<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online notes</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #ffffff;
      --surface: #f8fafc;
      --text: #0f172a;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --focus: #3b82f6;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #3b82f6;
        --primary-hover: #60a5fa;
        --bg: #0f172a;
        --surface: #1e293b;
        --text: #f1f5f9;
        --text-secondary: #94a3b8;
        --border: #334155;
        --focus: #60a5fa;
        --shadow: rgba(0, 0, 0, 0.3);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px;
      min-height: 100vh;
    }

    main {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 700;
      margin-bottom: 32px;
      color: var(--text);
    }

    .add-note-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 32px;
      box-shadow: 0 1px 3px var(--shadow);
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    .input-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    #noteInput {
      flex: 1;
      min-width: 200px;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #noteInput:focus {
      outline: none;
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    button {
      padding: 12px 24px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    button:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }

    .notes-section h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text);
    }

    #notesList {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .note-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 1px 2px var(--shadow);
      transition: box-shadow 0.2s;
    }

    .note-item:hover {
      box-shadow: 0 2px 4px var(--shadow);
    }

    .note-text {
      color: var(--text);
      word-wrap: break-word;
      margin-bottom: 8px;
    }

    .note-date {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-secondary);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .error-message {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 12px;
      font-size: 0.875rem;
    }

    @media (prefers-color-scheme: dark) {
      .error-message {
        background: #450a0a;
        color: #fca5a5;
        border-color: #7f1d1d;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .add-note-section {
        padding: 16px;
      }

      .input-group {
        flex-direction: column;
      }

      #noteInput {
        min-width: 100%;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Online notes</h1>

    <section class="add-note-section" aria-labelledby="add-note-heading">
      <h2 id="add-note-heading" class="visually-hidden">Add a new note</h2>
      <form id="noteForm">
        <label for="noteInput">Note</label>
        <div class="input-group">
          <input 
            type="text" 
            id="noteInput" 
            name="note"
            placeholder="Enter your note..."
            required
            aria-describedby="error-message"
          >
          <button type="submit">Add note</button>
        </div>
        <div id="error-message" role="alert" aria-live="polite"></div>
      </form>
    </section>

    <section class="notes-section" aria-labelledby="notes-heading">
      <h2 id="notes-heading">Your notes</h2>
      <ul id="notesList" aria-live="polite" aria-relevant="additions removals"></ul>
    </section>
  </main>

  <script>
    const noteForm = document.getElementById('noteForm');
    const noteInput = document.getElementById('noteInput');
    const notesList = document.getElementById('notesList');
    const errorMessage = document.getElementById('error-message');

    // Load notes on page load
    async function loadNotes() {
      try {
        const response = await fetch('/api/notes');
        if (!response.ok) throw new Error('Failed to load notes');
        const notes = await response.json();
        renderNotes(notes);
      } catch (error) {
        showError('Failed to load notes. Please refresh the page.');
      }
    }

    // Render notes list
    function renderNotes(notes) {
      if (notes.length === 0) {
        notesList.innerHTML = `
          <li class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="12" y1="18" x2="12" y2="12"></line>
              <line x1="9" y1="15" x2="15" y2="15"></line>
            </svg>
            <p>No notes yet. Add your first note above!</p>
          </li>
        `;
        return;
      }

      notesList.innerHTML = notes
        .map(note => {
          const date = new Date(note.createdAt);
          const formattedDate = date.toLocaleString('en-US', {
            month: 'short',
            day: 'numeric',
            year: 'numeric',
            hour: 'numeric',
            minute: '2-digit'
          });

          return `
            <li class="note-item">
              <p class="note-text">${escapeHtml(note.text)}</p>
              <time class="note-date" datetime="${note.createdAt}">${formattedDate}</time>
            </li>
          `;
        })
        .join('');
    }

    // Add a new note
    async function addNote(text) {
      try {
        const response = await fetch('/api/notes', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ text })
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Failed to add note');
        }

        // Reload all notes
        await loadNotes();
        noteInput.value = '';
        clearError();
      } catch (error) {
        showError(error.message);
      }
    }

    // Show error message
    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.className = 'error-message';
    }

    // Clear error message
    function clearError() {
      errorMessage.textContent = '';
      errorMessage.className = '';
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Handle form submission
    noteForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = noteInput.value.trim();
      
      if (!text) {
        showError('Please enter a note');
        return;
      }

      await addNote(text);
    });

    // Load notes on page load
    loadNotes();
  </script>
</body>
</html>
